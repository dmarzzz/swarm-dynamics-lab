  "title": "Capture and memory: does a purged swarm return? (exploratory, scripted)",
  "description": "Binary convention, N=24, random pairwise encounters. A committed minority above the tipping dose captures the population; it is then removed perfectly. Swept factor: agent memory window (1, 5, 20, full). Arms: no purge, purge, purge plus memory wipe. Scripted tanh policy (de-marzo-2026-conformity form over a FIFO memory as in magistrali-2026-aligned) for S0/S1/S1b; one open 8B model (Q0, S2_pilot, 2026-10-04, dev tasks, capped). Hunch under researchers/shadow/notes, hypothesis shadow-capture-memory is proposed, not accepted.",
