    "paired_contrast_note": "A contrast across memory lengths at different per-memory doses is not a same-dose comparison. Any contrast that includes the full-memory arm is reported twice: at the per-memory doses, and at the smallest common dose where every memory in the contrast captures >= 80% within H."
