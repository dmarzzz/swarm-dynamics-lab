id: sybil-split-xmodel
title: "Identity splitting at fixed attacker resources, replicated on two other models (Qwen3.7 Flash, GPT-6 Sol)"
description: Cross-model replication of sybil-split-opus on byte-identical packets. One attacker's 27 report rows,
  27 attachment edges and 27 verification attempts held by 1, 3, 9 or 27 identities; 108 honest simulated identities
  in two graph families; coverage, degree and random checks at 4 or 12 checks. Each of two pre-registered models
  (qwen/qwen3.7-flash with reasoning disabled, gpt-6-sol with low reasoning effort) runs its own chain; results are
  never pooled. Exploratory; identities and checks are simulated, only the synthesis is a model call.
