id: verify-cost-qwen
title: When is verification worth its cost? (Qwen3.7 Flash, program v5 line V)
description: One-step decision assay. One qwen/qwen3.7-flash call chooses between checking a report
  of stated error probability and exploring a cell with no evidence, when leaving a cell UNKNOWN has
  a stated cost. 24 paired layouts x 12 risk and cost cases x 2 equal-information representations
  (explicit prose, action-consequence table) = 576 calls; from attempt 002 the answer first states the
  expected cost of each action, then the choice; only the choice is scored, by expected regret against the
  analytic minimum-loss action. Scripted map consequences; exploratory; not multi-step sensing.
