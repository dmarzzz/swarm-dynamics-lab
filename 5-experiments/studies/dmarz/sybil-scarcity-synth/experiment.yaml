id: sybil-scarcity-synth
title: Can the synthesizer resist repeated fabrications when truth is scarce? (Opus 5.5)
description: Follow-up to sybil-scarcity-opus on fresh roots. 972 simulated identities, 108
  checks, strong checking; each rare fact has 1, 3, 9, 27 or 81 truthful carriers. Every
  486-report packet is read by claude-opus-5-5 in four configurations (effort low or high;
  the original prompt or the original plus one frozen evidence rule). Measures how often the
  answer is the repeated fabricated value and what the rule costs when truth is plentiful.
  Exploratory.
