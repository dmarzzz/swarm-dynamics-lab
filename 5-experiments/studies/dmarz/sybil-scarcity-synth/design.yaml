attempt: '001'
# Model ladder (required by dmarz/fleet-monitor, 2026-10-04). One model per attempt, chosen by the
# environment variable STUDY_MODEL (default: the first entry). Each model has its own prices, batch
# names, probe, qualification, ledger file and results directory. Models are never pooled.
model: claude-opus-5-5
model_ladder:
- claude-opus-5-5
- claude-opus-5
models:
  claude-opus-5-5:
    input_usd_per_million: 4
    output_usd_per_million: 20
    efforts: [low, medium, high, xhigh, max]
    thinking: always on; the request never carries a thinking field
  claude-opus-5:
    input_usd_per_million: 5
    output_usd_per_million: 25
    efforts: [low, medium, high, xhigh, max]
    thinking: on by default; the request never carries a thinking field
