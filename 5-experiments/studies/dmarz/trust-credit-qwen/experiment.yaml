id: trust-credit-qwen
title: When verification amplifies capture (program v5, line T)
description: One frozen coverage audit per root replayed under three admission rules that differ only in where
  the credit of a passed check goes (propagated to neighbours, direct only, anchors only); 324 scripted identities,
  162 seats, 32, 64 or 108 checks, strong or weak checks; qwen3.7-flash answers each admitted packet. The primary
  outcome (attacker seats) comes from scripted admission. Exploratory.
