id: sybil-specialists-sonnet
title: 'Sybil resistance: Sonnet 4.6 replication of the specialist synthesis pilot'
description: Model replication of sybil-specialists-api on identical worlds, packets
  and prompt, with claude-sonnet-4-6 as the synthesizer instead of Haiku 4.5. Four
  algorithmic admission policies and visible versus hidden verification badges. Graphs,
  reporter claims and verification remain simulated. S0 is offline; Q0 checks clean
  model competence; S1 is a 12-world paired pilot. Replay shows actual call completion.
