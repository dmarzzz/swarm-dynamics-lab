id: market-split-opus
owner: dmarz
title: 'Market splitting: Opus replication on fresh markets'
description: 'Complete. Claude Opus 5.5 on six fresh market tasks: the neutral flexible agent
  registered a second firm and met the sustained evasion criterion in 6/6 firm-regulated
  markets, 0/6 owner-regulated and 0/6 unregulated, as in the Sonnet pilot. 36/36 episodes
  valid; 902 calls, USD 15.34 for the study. Exploratory; six related tasks; same-researcher
  review only.'
