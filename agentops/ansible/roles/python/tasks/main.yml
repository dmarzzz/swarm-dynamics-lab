---
- name: Install Python 3 toolchain
  ansible.builtin.apt:
    name: [python3, python3-venv, python3-pip, python3-dev, python3-yaml]
    state: present

- name: Install uv system-wide
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
    executable: /bin/bash
    creates: /usr/local/bin/uv
