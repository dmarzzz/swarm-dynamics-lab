---
- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

# --- UFW Firewall ---
- name: Reset UFW to defaults
  community.general.ufw:
    state: reset

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto }}"
  loop: "{{ security_ufw_allowed_ports }}"

# Per-server extra ports from fleet.yml `ports:` (the DO cloud firewall opens the same ones).
- name: Allow fleet.yml ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ agentops_ports | default([]) }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

# --- Fail2Ban ---
- name: Deploy fail2ban jail config
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# --- SSH Hardening ---
- name: Harden sshd
  ansible.builtin.import_tasks: sshd.yml

# --- Unattended Upgrades ---
# Security updates install automatically, but a box never reboots on its own: an overnight reboot
# would kill every worker mid-run. Reboot by hand (`sudo reboot`) when nothing is claimed.
- name: Never auto-reboot after unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52swarm-no-auto-reboot
    mode: "0644"
    content: |
      // Managed by Ansible (agentops security role)
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable unattended upgrades
  ansible.builtin.dpkg_selections:
    name: unattended-upgrades
    selection: install
