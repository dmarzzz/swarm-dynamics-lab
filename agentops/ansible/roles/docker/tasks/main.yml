---
- name: Install Docker from Ubuntu's archive
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - docker-buildx
    state: present
    update_cache: true

- name: Add everyone with access to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ agentops_access }}"

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
