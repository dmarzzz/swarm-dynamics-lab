[defaults]
inventory = inventory/fleet.py
roles_path = roles/
remote_tmp = /tmp/.ansible-${USER}
forks = 10
# New droplets have new host keys every time; accept on first contact.
host_key_checking = false
stdout_callback = default
retry_files_enabled = false
interpreter_python = auto_silent

[privilege_escalation]
become = true
become_method = sudo
become_user = root

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no

[callback_default]
result_format = yaml
