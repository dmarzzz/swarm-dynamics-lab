# Frozen design of sybil-rules-180. Covered by study.source_hash(): any change needs a new attempt.
version: 1
experiment: sybil-rules-180
status: exploratory
attempt: '002'
program: ../overnight-program-2026-10-04/program.json
model: qwen/qwen3.7-flash
canonical_model: qwen/qwen3.7-flash-20260727
provider: alibaba
# Attempt 002 model ladder (dated addition 2026-10-04, dmarz via dmarz/fleet-monitor): the model is a launch parameter
# (environment STUDY_MODEL, set by the launcher). Each model is its own run of the whole chain: batch names carry its
# tag, its own ledger file, dollar cap and results directory, its own P0, Q0 and X0; models are never pooled.
# The first entry is the program's model. The second is an OpenAI model on its own server triple and claim.
models:
  qwen/qwen3.7-flash:
    api: openrouter
    tag: ''
    status: ready
    usd_cap: 5
    # Its request template, prices and budget are the top-level ones below.
    # This model's attempt 002 continues attempt 001's ledger file; its caps add attempt 001's one P0 reservation.
    carried_from_attempt_001: {P0: 1}
  # Pinned 2026-10-04 by dmarz/fleet-monitor's decision (replaces the declared gpt-6-luna entry): OpenAI Chat
  # Completions via the reference adapter (src/openai_provider.py, from swarm-lab 8290d7ad). Prices are the adapter's
  # PRICES row (standard tier, retrieved 2026-10-04T12:10Z). reasoning_effort low; max_completion_tokens covers
  # visible plus reasoning tokens. reservation_margin 1: the byte bound is already an upper bound on every call.
  gpt-6-sol:
    api: openai
    tag: gpt-6-sol
    status: ready
    usd_cap: 150
    carried_from_attempt_001: {}
    canonical_model: gpt-6-sol
    # Its own fresh probe and qualification fixtures, from the unused part of the reserved range 318600-318699
    # (the Qwen configuration of attempt 002 used 318600-318617, 318620-318625, 318630-318635).
    fixtures:
      probe_first_market_id: 318640
      ordinary_markets: [318660, 318661, 318662, 318663, 318664, 318665]
      smoke_markets: [318670, 318671, 318672, 318673, 318674, 318675]
    request_template:
      model: gpt-6-sol
      reasoning_effort: low
      max_completion_tokens: 2000
      response_format:
        type: json_object
    budget:
      max_output_tokens: 2000
      in_flight_per_host: 3
      in_flight_per_host_max: 3
      reservation_margin: 1
      prices: {input: 2.0, cached_input: 0.2, cache_write: 2.5, output: 10.0}
      retry:
        transport_retries: 2
        retryable_http_status: [429, 500, 502, 503, 504]
        backoff_seconds: [2, 6]
        retry_after_cap_seconds: 20
  # Replication R2 (dated addition by dmarz/fleet-monitor, 2026-10-04, after seeing attempt 002's result): the original
  # economy seed on gpt-6-luna, configured like gpt-6-sol. Fresh probe and qualification fixtures from the last unused
  # ids of the reserved range 318600-318699; X0, main and D1 fixtures are those gpt-6-sol saw (a different model reusing
  # clean fixtures).
  gpt-6-luna:
    api: openai
    tag: gpt-6-luna
    status: ready
    usd_cap: 15
    carried_from_attempt_001: {}
    canonical_model: gpt-6-luna
    fixtures:
      probe_first_market_id: 318676
      ordinary_markets: [318694, 318695, 318696, 318697, 318698, 318699]
      smoke_markets: [318626, 318627, 318628, 318629, 318636, 318637]
    request_template:
      model: gpt-6-luna
      reasoning_effort: low
      max_completion_tokens: 2000
      response_format:
        type: json_object
    budget:
      max_output_tokens: 2000
      in_flight_per_host: 3
      in_flight_per_host_max: 3
      reservation_margin: 1
      prices: {input: 0.1, cached_input: 0.01, cache_write: 0.125, output: 0.5}
      retry:
        transport_retries: 2
        retryable_http_status: [429, 500, 502, 503, 504]
        backoff_seconds: [2, 6]
        retry_after_cap_seconds: 20
# Replications (dated addition by dmarz/fleet-monitor, 2026-10-04, after seeing attempt 002's result; follow-ups, not
# confirmations of a hypothesis stated before all data). A replication is a launch parameter (STUDY_REPLICATION, set by
# the launcher's --replication): the same frozen design with a fresh economy seed and fresh fixtures; its own batches,
# ledger, dollar cap, results and worker-session experiment; never pooled with attempt 002.
replications:
  r1:
    models: [gpt-6-sol]
    usd_cap: 120
    economy:
      seed: sybil-rules-180-economy-r1
      first_market_id: 319000
    fixtures:
      probe_first_market_id: 319400
      ordinary_markets: [319420, 319421, 319422, 319423, 319424, 319425]
      smoke_markets: [319430, 319431, 319432, 319433, 319434, 319435]
      context_first_market_id: 319700
      diagnostic_markets: [319300, 319301, 319302, 319303, 319304, 319305, 319306, 319307, 319308, 319309, 319310, 319311]
request_template:
  model: qwen/qwen3.7-flash
  provider:
    only:
    - alibaba
    allow_fallbacks: false
    require_parameters: true
  reasoning:
    enabled: false
  max_tokens: 1000
  response_format:
    type: json_object
cfg:
  start_cash: 2500
  max_firms: 4
  registration_fee: 20
  overhead: 3
  fine_rate: 0.35
  threshold: 0.38
  history_rounds: 3
  text_limit: 240
economy:
  seed: sybil-rules-180-economy-001
  markets: 60
  first_market_id: 318000
  hosts: 3
  warmup_rounds: 2
  branch_rounds: 10
  branches:
    A:
      regime: firm
      prohibition: false
    B:
      regime: firm
      prohibition: true
    C:
      regime: owner
      prohibition: true
  branch_order_seed: sybil-rules-180-branch-order-001
  branch_order:
  - C
  - B
  - A
  # Dated addition by dmarz/fleet-monitor, 2026-10-04, not part of program v5: a second run of condition A from
  # the same checkpoint, collected after the three program branches, to show sampling variation between continuations.
  noise_floor:
    A2:
      repeat_of: A
  streak: 3
material:
  # A void is a forced null owner-round. Fixed before any model call; not changed after X0.
  round_void_limit: 36
  warmup_void_limit: 36
  branch_void_limit: 180
fixtures:
  development_markets: [318500, 318501, 318502, 318503, 318504, 318505]
  # Attempt 002: fresh probe and Q0 fixtures from the range reserved for one repair configuration (second and last
  # configuration the program allows). Attempt 001 used probe 318400, ordinary 318200-318205, smoke 318100-318105.
  probe_first_market_id: 318600
  ordinary_markets: [318620, 318621, 318622, 318623, 318624, 318625]
  ordinary_rounds: 8
  smoke_markets: [318630, 318631, 318632, 318633, 318634, 318635]
  smoke_rounds: 4
  context_first_market_id: 318700
  diagnostic_markets: [318300, 318301, 318302, 318303, 318304, 318305, 318306, 318307, 318308, 318309, 318310, 318311]
  diagnostic_rounds: 8
  reserved_for_one_repair_configuration: consumed by attempt 002
qualification:
  probes_exact: 18
  ordinary_min_profit_ratio: 0.75
  ordinary_positive_profit_all: true
  valid_responses_required: all
  context_max_failed_calls: 2
  context_min_valid_actions: 171
  planning_marker_calls_per_second: 1.0
  projection_overhead_factor: 1.25
stages:
  S0: {backend: scripted, batch: s0-002, calls: 0}
  P0: {backend: openrouter, batch: p0-002, calls: 1}
  Q0: {backend: openrouter, batch: q0-002, calls: 185}
  X0: {backend: openrouter, batch: x0-002, calls: 180}
  S1: {backend: openrouter, batch: s1-002, calls: 7560}
  D1: {backend: openrouter, batch: d1-002, calls: 192}
budget:
  authorization: 'dmarz to dmarz/fleet-monitor 2026-10-04: ship the big agent swarm run; OpenRouter key limit USD 50; this study hard cap USD 5'
  aggregate_usd: 5
  # REISSUE: ledger reservations for call ids re-issued once after a lost task (the lost send may have been billed).
  max_calls: {S0: 0, P0: 1, Q0: 185, X0: 180, S1: 7560, D1: 192, REISSUE: 360}
  max_attempted_calls: 8478
  max_transport_attempts: 9800
  max_output_tokens: 1000
  max_input_tokens: 8000
  max_input_bytes: 32000
  max_visible_chars: 4000
  input_usd_per_million: 0.03
  output_usd_per_million: 0.13
  request_timeout_seconds: 120
  retry:
    transport_retries: 2
    retryable_http_status: [429, 502, 503, 529]
    backoff_seconds: [2, 6]
    retry_after_cap_seconds: 20
  billing_outage:
    retry_every_seconds: 60
    max_wait_seconds: 1200
  in_flight_per_host: 2
  in_flight_per_host_max: 3
  task_timeout_seconds: 2700
  worker_silent_seconds: 240
  liveness_check_seconds: 30
  hub_poll_seconds: 3
  hub_backoff_max_seconds: 30
  worker_attach_seconds: 1800
  stage_timeout_seconds: {S0: 1800, P0: 600, Q0: 3600, X0: 1800, S1: 21600, D1: 3600}
  chain_timeout_seconds: 32400
