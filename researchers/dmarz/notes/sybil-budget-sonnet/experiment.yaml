id: sybil-budget-sonnet
title: How much verification does Sybil resistance need? (Sonnet 4.6 replication)
description: 'TLDR: Does a stronger synthesizer change how much identity verification a Sybil-attacked
  swarm needs? Sonnet 4.6 answers the byte-identical N972 packets (4-108 random or coverage
