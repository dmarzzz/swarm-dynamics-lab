id: memory-handoff-qwen
title: Can successors repair inherited false memory? (Qwen3.7 Flash)
description: One fresh successor per assignment inherits a predecessor's notes in one of six
  memory states (clean, misquoted source, stale version, copies presented as independent,
  equal-authority contradiction, false original source) under one of four handoff policies
  (raw inheritance, metadata-only origin and version resolution, content-bound retrieval of
  the cited records, reset). 24 roots x 6 states x 4 policies = 576 calls of qwen/qwen3.7-flash
  (OpenRouter, Alibaba, reasoning disabled). Research program v5, line M. Exploratory.
