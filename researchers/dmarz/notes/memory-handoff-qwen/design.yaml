answer_format:
  version: 2                    # qwen/qwen3.7-flash; gpt-6-luna uses version 1 (value and sources only), same tolerant validation
  keys: [records, counting_values, distinct_origins, value, sources]
  scored: [value, sources]
  working_fields: [records, counting_values, distinct_origins]       # reported, never gated
  tolerated: [value as a number with a zero fraction, value as a string of digits, repeated source IDs, sources null,
              missing or malformed working fields, extra keys, any key order, current as a string]
  invalid: [not one JSON object, a repeated key, value or sources missing, value neither integer-like nor null,
            sources neither a list of strings nor null, longer than max_visible_chars, cut off at max_tokens]

primary_contrast:
  metric: inherited_error
  definition: the successor's value equals the false inherited value plus delta
  contrast: content minus metadata, mean of the misquote and stale states within each root
  unit: root
  roots: 24
  expected_direction: decrease
  reference_actor_value: -0.5
  status: exploratory

utility_guard:
  metric: clean_correct
  definition: in the clean state the successor's value equals truth plus delta
  policies: [raw, metadata, content]

analysis:
  bootstrap_draws: 10000
  bootstrap_seed: 20261004
  missing_outcome_bounds: [0, 1]
