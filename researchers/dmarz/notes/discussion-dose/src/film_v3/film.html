<script>
const D = /*__DATA__*/null;
const QR = `/*__QR__*/`;
const W = D.worked, ARMS = ['independent', 'reports', 'private', 'board'];
const film = document.getElementById('film'), wires = document.getElementById('wires');
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);              // entrances ease out
const io = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, u) => a + (b - a) * u;
const vis = (t, a, b = 1e9, din = .733, dout = .467) => ease((t - a) / din) * (1 - ease((t - b) / dout));
const anims = []; const on = fn => anims.push(fn);
const el = (cls, parent, html, css) => { const n = document.createElement('div'); n.className = cls; if (html != null) n.innerHTML = html;
  if (css) n.style.cssText = css; parent.appendChild(n); return n; };
const at = (n, x, y) => { n.style.left = x + 'px'; n.style.top = y + 'px'; return n; };
const svg = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || wires).appendChild(n); return n; };
const wire = (d, parent, cls = 'wire') => svg('path', { d, class: cls, pathLength: 1 }, parent);
const draw = (p, t, a, d = .8) => { const u = io((t - a) / d); p.style.strokeDasharray = '1'; p.style.strokeDashoffset = 1 - u; p.style.visibility = u > 0 ? 'visible' : 'hidden'; };
const show = (n, o, dy = 0) => { n.style.opacity = o; if (dy) n.style.transform = `translateY(${(1 - Math.min(1, o)) * dy}px)`; };
const of6 = n => `${n} of ${D.worlds.length}`;

/* ------------------------------------------------------------------ timeline */
const A = D.attacked, Q = D.qualification;
const rightBoard = A.board.correct, rightPrivate = A.private.correct;
const CAPS = [
  ['A1', 4.8, 'A swarm of AI agents splits a job, compares notes, and leaves a memory for whoever comes next.'],
  ['A2', 5.6, `The job: pick the one site with power >= 16 and access <= 7. Each agent sees only its own records.`],
  ['A3', 5.6, `One agent also gets a planted record: ${W.key} = ${W.false}. The true value is ${W.true}. Believe it and ${W.target} wins.`],
  ['A4', 5.0, `Later a fresh parent sees only the merged memory and is asked for ${W.key} + ${W.delta}. The truth is ${W.truth_answer}.`],
  ['B1', 5.6, 'The experiment forks the same swarm four ways. Each fork merges into its own memory and parent.'],
  ['B2', 5.4, 'Private work and the public board get the same prompt and call count. Only the board hears peers.'],
  ['B3', 4.6, 'The hunch: more discussion changes how often the planted value reaches the parent.'],
  ['B4', 5.6, 'If talk repairs, deliberation is a defence. If it amplifies, one poisoned agent steers the memory.'],
  ['B5', 5.2, 'If it changes nothing, the break is elsewhere in the chain: first reports, merge rule, or parent.'],
  ['C1', 6.0, `The recorded run, world ${W.world}. Before sharing, one agent holds the planted ${W.false}, another the true ${W.true}.`],
  ['C2', 5.4, `After one exchange of reports all three endorse ${W.false}. The agent with the primary record drops it.`],
  ['C3', 6.2, `Merge now and memory records ${W.false}: the parent answers ${W.arms.reports.parent.value}. With no sharing, it has nothing to go on.`],
  ['C4', 6.6, `Three rounds alone: one agent recovers ${W.true}. No majority forms, the fact drops, the parent abstains.`],
  ['C5', 7.0, `Three rounds together: that agent posts its primary record. By round 3 all hold ${W.true} and vote ${W.winner}.`],
  ['C6', 3.6, `Memory records ${W.true}. The parent answers ${W.arms.board.parent.value}.`],
  ['D1', 5.4, `All six attacked worlds. Small dots are the agents' final beliefs, the ring is the parent's answer.`],
  ['D2', 6.2, `Merging after one exchange misled ${of6(A.reports.wrong)} parents. Three more rounds: ${A.private.wrong} wrong alone, ${A.board.wrong} together.`],
  ['D3', 6.0, `Board parents were right in ${rightBoard} worlds, private in ${rightPrivate}. On the frozen primary measure the difference is ${D.primary.mean}.`],
  ['D4', 5.8, `A caveat: with no attack, reports-only agents voted right in ${of6(Q.clean_reports_correct)} worlds. The floor was ${Q.required_each}.`],
  ['D5', 6.2, 'So far: merging early does the damage, more rounds repair it. Talk versus solo work is not settled.'],
  ['E', 5.0, ''],
];
const T = {}; let acc = 2.6;
for (const [k, d] of CAPS) { T[k] = acc; acc += d; }
const DURATION = acc;
const capBox = document.getElementById('cap');
CAPS.forEach(([k, d, text]) => { if (!text) return; const p = document.createElement('p'); p.textContent = text; capBox.appendChild(p);
  on(t => show(p, vis(t, T[k] + .1, T[k] + d - .35, .5, .3), 8)); });

/* ------------------------------------------------------------------ field (the painted ground) */
const field = document.getElementById('field');
const fUp = el('abs', field, '', 'left:-6%;right:-6%;top:-8%;background:radial-gradient(70% 90% at 30% 40%, var(--color-field-upper), rgba(40,60,190,.34) 55%, transparent 100%);filter:blur(70px)');
const fLo = el('abs', field, '', 'left:-6%;right:-6%;bottom:-10%;background:radial-gradient(75% 95% at 68% 62%, var(--color-field-lower), rgba(120,40,200,.32) 55%, transparent 100%);filter:blur(80px)');
const fSeam = el('abs', field, '', 'left:8%;right:8%;height:6%;background:linear-gradient(90deg, transparent, var(--color-field-seam), rgba(120,190,255,.22), transparent);filter:blur(38px)');
el('abs', field, '', 'left:-4%;bottom:-12%;width:34%;height:38%;background:radial-gradient(closest-side, var(--color-field-warm), transparent);filter:blur(60px)');
// held darker than the kit's card field: this film puts small type across the whole frame
el('abs fill', field, '', 'background:radial-gradient(78% 74% at 50% 50%, rgba(3,5,10,.9), rgba(3,5,10,.72) 70%, rgba(3,5,10,.4) 100%)');
const fGrid = el('abs fill', field, '', 'background-image:repeating-linear-gradient(0deg, rgba(170,200,255,.05) 0 1px, transparent 1px 48px), repeating-linear-gradient(90deg, rgba(170,200,255,.05) 0 1px, transparent 1px 48px);-webkit-mask-image:radial-gradient(80% 75% at 50% 50%, rgba(0,0,0,.85), transparent 100%);mask-image:radial-gradient(80% 75% at 50% 50%, rgba(0,0,0,.85), transparent 100%)');
on(t => { const f = t * 30, a = Math.sin(f / 150), b = Math.cos(f / 190), seam = 50 + 2.2 * Math.sin(f / 120);
  fUp.style.height = (seam + 4) + '%'; fUp.style.transform = `translate(${a * 26}px, ${b * 14}px)`;
  fLo.style.height = (100 - seam + 8) + '%'; fLo.style.transform = `translate(${-a * 30}px, ${-b * 12}px)`;
  fSeam.style.top = (seam - 3) + '%'; fSeam.style.opacity = .8 + .2 * a;
  fGrid.style.backgroundPosition = `${(f * .16) % 48}px 0px`; });

/* ------------------------------------------------------------------ title */
const title = document.getElementById('title'), inst = document.getElementById('inst');
inst.textContent = `swarm lab // sec-47: where does the fork-and-return chain fail // run v3-q0-a1 // claude haiku 4.5 // 2026-10-04`;
on(t => { show(title, vis(t, .8, T.E - .2), 14); show(inst, vis(t, 1.3, T.E - .2), 10); });

/* ------------------------------------------------------------------ the stage: one world through the chain */
const XI = 720, XR = 900, XN = [1060, 1190, 1320], XM = 1500, XP = 1690, YT = 420;
const LY = { independent: 240, reports: 420, private: 600, board: 780 };
const stage = document.getElementById('stage'), wStage = svg('g', {});
const tFork = T.B1 + .4;
const OFF = [[0, -24], [-26, 20], [26, 20]];

function dot(parent, x, y, r) { const n = el('dot', parent, '', `left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;font-size:${Math.round(r * .95)}px;line-height:${2 * r - 4}px`);
  n._st = []; on(t => { let s = null; for (const k of n._st) if (k.t <= t) s = k;
    n.dataset.s = s ? s.s : 'idle'; n.textContent = s ? s.v : '';
    const age = s ? t - s.t : 9; n.style.transform = `scale(${1 + (age < .45 ? Math.sin(Math.PI * age / .45) * .16 : 0)})`; });
  return n; }
function cluster(parent, wParent, cx, cy, linked, k = 1) { const r = 20 * k;
  const pts = OFF.map(([dx, dy]) => [cx + dx * k, cy + dy * k]);
  const tri = linked ? wire(`M${pts[0]}L${pts[1]}L${pts[2]}Z`, wParent, 'link') : null;
  return { dots: pts.map(([x, y]) => dot(parent, x, y, r)), tri, cx, cy }; }
function setStage(c, t, st) { st.beliefs.forEach((b, i) => c.dots[i]._st.push({ t: t + i * .14, s: b, v: st.votes[i] === '-' ? '·' : st.votes[i] })); }
function stateful(n, render) { n._st = []; on(t => { let s = null; for (const k of n._st) if (k.t <= t) s = k; render(n, s, s ? t - s.t : 9); }); return n; }
function memory(parent, x, y) { return stateful(at(el('mem', parent), x - 78, y - 31), (n, s, age) => {
  n.dataset.s = s ? (s.target || 'none') : 'idle';
  const html = !s ? '<i style="margin-top:12px">memory</i>'
    : `<b>${W.key} ${s.target ? s.value : '—'}</b><i>${s.records} fact${s.records === 1 ? '' : 's'} kept</i>`;
  if (n._html !== html) { n.innerHTML = html; n._html = html; }
  n.style.transform = `scale(${1 + (age < .45 ? Math.sin(Math.PI * age / .45) * .08 : 0)})`; }); }
const WORD = { wrong: 'wrong', correct: 'right', abstain: 'abstains' };
function parent(par, x, y) { const ring = at(el('ring', par), x - 26, y - 26), ans = at(el('ans', par), x + 40, y - 24);
  stateful(ring, (n, s, age) => { n.dataset.s = s ? s.outcome : 'idle';
    n.style.transform = `scale(${1 + (age < .45 ? Math.sin(Math.PI * age / .45) * .14 : 0)})`;
    ans.dataset.s = s ? s.outcome : 'idle';
    const html = s ? `<b>${s.value == null ? '—' : s.value}</b><i>${WORD[s.outcome]}</i>` : '';
    if (ans._html !== html) { ans.innerHTML = html; ans._html = html; } });
  return ring; }

/* the world table */
const left = el('g', stage), wLeft = svg('g', {}, wStage);
const TX = { site: 100, power: 196, access: 400, note: 500 }, TY = { A: 350, B: 420, C: 490 };
const tTable = T.A2 + .3;
const hdr = at(el('inst', left, `world ${W.world} // the records`), 100, 262);
const cols = ['site', 'power', 'access'].map(k => at(el('inst', left, k), TX[k], 304));
on(t => { show(hdr, vis(t, tTable)); cols.forEach(c => show(c, vis(t, tTable + .2))); });
const fact = k => W.facts.find(f => f.key === k && !f.planted);
const NOTE = site => { const p = W.truth[site + '.power'], a = W.truth[site + '.access'];
  return p < 16 ? `power ${p} < 16` : a > 7 ? `access ${a} > 7` : 'qualifies'; };
let cPower = null;
['A', 'B', 'C'].forEach((site, i) => { const t0 = tTable + .5 + i * .45, y = TY[site];
  const cells = [at(el('cell', left, site), TX.site, y)];
  for (const k of ['power', 'access']) { const f = fact(`${site}.${k}`);
    const c = at(el('cell', left, `${f.value}<small>a${f.agent}</small>`), TX[k], y); cells.push(c);
    if (`${site}.${k}` === W.key) cPower = c; }
  const note = at(el('note', left, NOTE(site)), TX.note, y + 8);
  if (NOTE(site) === 'qualifies') note.style.color = 'var(--ink)';
  on(t => { cells.forEach(c => show(c, vis(t, t0), 10)); show(note, vis(t, T.A2 + 3.2 + i * .25)); }); });
// the planted record: lands in the table, then a copy travels to the exposed agent
const planted = W.facts.find(f => f.planted);
const chip = at(el('chip', left, `${planted.value}<small>planted // a${planted.agent}</small>`), TX.power + 62, TY.C);
const flyer = at(el('chip', left, `${planted.value}`), 0, 0);
const exposedXY = [XI + OFF[W.roles.exposed][0], YT + OFF[W.roles.exposed][1]];
on(t => { show(chip, vis(t, T.A3 + .4), 10); cPower.style.color = t > T.A3 + .4 ? 'var(--zip)' : '';
  const u = io((t - (T.A3 + 1.5)) / 1.5), x0 = TX.power + 62, y0 = TY.C;
  flyer.style.left = lerp(x0, exposedXY[0] - 20, u) + 'px'; flyer.style.top = lerp(y0, exposedXY[1] - 16, u) + 'px';
  flyer.style.opacity = u > 0 && u < 1 ? 1 : 0; flyer.style.transform = `scale(${lerp(1, .6, u)})`; });
// legend, shown when the run starts
const LEG = [['false', `holds the planted ${W.false}`], ['true', `holds the true ${W.true}`], ['none', `no value for ${W.key}`]];
const legs = LEG.map(([s, text], i) => { const n = at(el('legend', left, `<div class="dot" data-s="${s}"></div><span>${text}</span>`), 100, 600 + i * 34); return n; });
legs.push(at(el('legend', left, `<span style="left:0">letter = vote // · = no vote</span>`), 100, 600 + 3 * 34));
on(t => legs.forEach((n, i) => show(n, vis(t, T.C1 + .2 + i * .12))));

/* trunk: the three agents, then the same three after one exchange of reports */
const trunk = el('g', stage), wTrunk = svg('g', {}, wStage);
const c0 = cluster(trunk, wTrunk, XI, YT, false), cR = cluster(trunk, wTrunk, XR, YT, true);
const ids = OFF.map(([dx, dy], i) => at(el('lbl', trunk, 'a' + i), XI + dx + (i === 1 ? -50 : i === 2 ? 28 : -9), YT + dy + (i === 0 ? -44 : -8)));
const l0 = at(el('lbl', trunk, 'three agents'), XI - 52, YT + 58), lR = at(el('lbl', trunk, 'after reports'), XR - 75, YT + 58);
const introA = wire(`M${XI + 52},${YT} H${XM - 80}`, wTrunk), exch = wire(`M${XI + 52},${YT} H${XR - 52}`, wTrunk);
on(t => { c0.dots.forEach((d, i) => show(d, vis(t, T.A1 + .4 + i * .15))); ids.forEach((n, i) => show(n, vis(t, T.A1 + .7 + i * .15)));
  show(l0, vis(t, T.A1 + 1.1)); l0.textContent = t > T.C1 ? 'private ballots' : 'three agents';
  draw(introA, t, T.A1 + 1.4, .9); introA.style.opacity = .7 * (1 - io((t - tFork) / .5));
  draw(exch, t, tFork, .6);
  cR.dots.forEach((d, i) => show(d, vis(t, tFork + .3 + i * .1))); cR.tri.style.opacity = .5 * vis(t, tFork + .6); show(lR, vis(t, tFork + .7));
  // the exchange itself: the link brightens when reports cross
  const pulse = Math.max(0, 1 - Math.abs(t - (T.C2 + .7)) / .7); exch.style.stroke = pulse > 0 ? 'var(--ink)' : ''; exch.style.strokeWidth = 1.6 + 1.6 * pulse; });
c0.dots[W.roles.exposed]._st.push({ t: T.A3 + 3.0, s: 'false', v: '' });
setStage(c0, T.C1 + .7, W.initial);
setStage(cR, T.C2 + 1.2, W.reports);

/* four lanes: each ends in its own memory and parent */
const LANES = {
  independent: { name: 'independent vote', sub: 'no sharing', lx: 880, ly: -38,
    d: `M${XI + 12},${YT - 50} C${XI + 22},${YT - 120} ${XI + 60},${LY.independent} ${XI + 150},${LY.independent} H${XM - 80}` },
  reports: { name: 'reports only', sub: 'merge at once', lx: 1004, ly: -38, d: `M${XR + 52},${YT} H${XM - 80}` },
  private: { name: 'private work', sub: 'three more rounds alone', lx: 1004, ly: -80,
    d: `M${XR + 50},${YT + 8} C${XR + 100},${YT + 8} ${XR + 56},${LY.private} ${XN[0] - 56},${LY.private}` },
  board: { name: 'public board', sub: 'three more rounds together', lx: 1004, ly: -80,
    d: `M${XR + 40},${YT + 22} C${XR + 84},${YT + 60} ${XR + 40},${LY.board} ${XN[0] - 56},${LY.board}` },
};
const laneFocus = (t, arm) => {                     // which lanes are lit at time t
  if (t < T.B2) return 1;
  if (t < T.B3) return arm === 'private' || arm === 'board' ? 1 : lerp(1, .3, io((t - T.B2) / .5));
  if (t < T.C3) return 1;
  const focus = t < T.C4 ? ['independent', 'reports'] : t < T.C5 ? ['private'] : t < T.C6 + 1.6 ? ['board'] : ARMS;
  return focus.includes(arm) ? 1 : .5; };
ARMS.forEach((arm, ai) => { const L = LANES[arm], y = LY[arm], g = el('g', stage), w = svg('g', {}, wStage), tIn = tFork + .5 + ai * .55;
  const rounds = arm === 'private' || arm === 'board';
  const p1 = wire(L.d + (rounds ? ` M${XN[0] + 50},${y} H${XN[1] - 50} M${XN[1] + 50},${y} H${XN[2] - 50} M${XN[2] + 50},${y} H${XM - 80}` : ''), w);
  const p2 = wire(`M${XM + 80},${y} H${XP - 30}`, w);
  const label = at(el('lane', g, `${L.name}<i>${L.sub}</i>`), L.lx, y + L.ly);
  const cs = rounds ? XN.map(x => cluster(g, w, x, y, arm === 'board')) : [];
  const rl = rounds ? XN.map((x, i) => at(el('lbl', g, 'round ' + (i + 1)), x - 30, y + 50)) : [];
  const mem = memory(g, XM, y), par = parent(g, XP, y);
  const trunkLane = arm === 'reports';             // before the fork this lane's memory and parent are the whole chain
  on(t => { const o = laneFocus(t, arm); g.style.opacity = o; w.style.opacity = o;
    draw(p1, t, trunkLane ? tFork : tIn, 1.0);
    draw(p2, t, trunkLane ? T.A1 + 3.0 : tIn + .5, .5);
    show(label, vis(t, tIn));
    cs.forEach((c, i) => { c.dots.forEach(d => show(d, vis(t, tIn + .5 + i * .12))); if (c.tri) c.tri.style.opacity = .5 * vis(t, tIn + .7 + i * .12); });
    rl.forEach((n, i) => show(n, vis(t, tIn + .6 + i * .12)));
    const u = trunkLane ? 1 : io((t - tFork) / .9), dy = lerp(YT - y, 0, u);
    for (const n of [mem, par, par.nextSibling]) n.style.marginTop = dy + 'px';
    const a = trunkLane ? 1 : vis(t, tFork, 1e9, .5);
    show(mem, a * vis(t, T.A1 + 2.2)); show(par, a * vis(t, T.A1 + 3.4)); par.nextSibling.style.opacity = a; });
  LANES[arm].cs = cs; LANES[arm].mem = mem; LANES[arm].par = par; LANES[arm].w = w; });
const cellOf = arm => W.arms[arm];
const fin = (arm, tm, tp) => { const c = cellOf(arm);
  LANES[arm].mem._st.push({ t: tm, target: c.memory.target, value: c.memory.target_value, records: c.memory.records });
  LANES[arm].par._st.push({ t: tp, outcome: c.parent.outcome, value: c.parent.value }); };
fin('reports', T.C3 + .6, T.C3 + 1.7);
fin('independent', T.C3 + 3.2, T.C3 + 4.1);
cellOf('private').rounds.forEach((st, i) => setStage(LANES.private.cs[i], T.C4 + .6 + i * 1.3, st));
fin('private', T.C4 + 4.5, T.C4 + 5.3);
const tBoard = [T.C5 + .6, T.C5 + 2.8, T.C5 + 4.8];
cellOf('board').rounds.forEach((st, i) => setStage(LANES.board.cs[i], tBoard[i], st));
fin('board', T.C6 + .4, T.C6 + 1.3);
on(t => LANES.board.cs.forEach((c, i) => { const p = Math.max(0, 1 - Math.abs(t - tBoard[i]) / .6); c.tri.style.strokeWidth = 1.4 + 1.8 * p; }));
const quote = at(el('quote', LANES.board.mem.parentNode, `<i>a${W.quote.agent}, round ${W.quote.turn}:</i> “${W.quote.text}”`), 1004, LY.board + 78);
on(t => show(quote, vis(t, T.C5 + 1.0, T.C6 + 3.0)));

/* column heads: what is merged, what the parent is asked */
const hM = el('head inst', trunk, 'merged memory'), hP = el('head', trunk, `<span class="inst">fresh parent</span><span class="q">asked ${W.key} + ${W.delta}</span><span class="q t-zip">truth ${W.truth_answer}</span>`);
on(t => { const u = io((t - tFork) / .9);
  at(hM, XM - 150, lerp(YT + 44, 176, u)); show(hM, vis(t, T.A1 + 2.4));
  at(hP, XP - 150, lerp(YT + 40, 132, u)); show(hP, vis(t, T.A1 + 3.6));
  hP.querySelectorAll('.q').forEach((q, i) => q.style.opacity = vis(t, T.A4 + .5 + i * .9)); });

/* the stage dims for the hunch and leaves for the six-world table */
on(t => { const o = lerp(1, .05, io((t - T.B3) / .6) * (1 - io((t - (T.C1 - .5)) / .6))) * (1 - io((t - (T.D1 - .1)) / .5));
  stage.style.opacity = o; wStage.style.opacity = o; });

/* ------------------------------------------------------------------ the hunch and what each outcome would mean */
const hunch = document.getElementById('hunch');
const hHead = at(el('inst', hunch, 'the hunch'), 100, 262);
const hBig = el('big', hunch, 'More discussion changes how often the planted value reaches the parent.');
const ROWS = [['if talk repairs', 'fewer wrong parents on the board', '-> let swarms deliberate before merging', T.B4 + .3],
  ['if talk amplifies', 'more wrong parents on the board', '-> cap or isolate discussion', T.B4 + 2.6],
  ['if it changes nothing', 'the same on both', '-> fix the reports, the merge rule, the parent', T.B5 + .3]];
const hRows = ROWS.map(([a, b, c, t0], i) => { const n = el('row', hunch, `<b>${a}</b><span>${b}</span><em>${c}</em>`); at(n, 0, 470 + i * 84); return [n, t0]; });
const hMeasure = at(el('inst', hunch, 'measured as // wrong parent answers under attack, net of the clean twin // board minus private'), 100, 760);
on(t => { const out = T.C1 - .6; show(hHead, vis(t, T.B3 + .3, out)); show(hBig, vis(t, T.B3 + .5, out), 12);
  hRows.forEach(([n, t0]) => show(n, vis(t, t0, out), 10)); show(hMeasure, vis(t, T.B5 + 2.2, out)); });

/* ------------------------------------------------------------------ all six worlds */
const grid = document.getElementById('grid'), wGrid = svg('g', {});
const GX = i => 700 + i * 140, MINI = [[0, -11], [-12, 9], [12, 9]];
const SUB = { independent: 'no sharing', reports: 'merge after one exchange', private: 'three more rounds alone', board: 'three more rounds together' };
const heads = D.worlds.map((w, i) => at(el('inst', grid, w.id), GX(i) - 24, 180));
const groups = [['resolvable // primary outranks planted', 0], ['ambiguous // planted has equal rank', 3]]
  .map(([text, i]) => at(el('inst', grid, text), GX(i) - 46, 846));
const tCol = i => T.D1 + .6 + i * .5;
ARMS.forEach((arm, ai) => { const y = LY[arm];
  const name = at(el('rowname', grid, `${LANES[arm].name}<i>${SUB[arm]}</i>`), 100, y - 30);
  on(t => show(name, vis(t, T.D1 + .2 + ai * .1), 10));
  D.grid[arm].forEach((c, i) => { const x = GX(i), t0 = tCol(i) + ai * .07;
    const dots = MINI.map(([dx, dy], k) => { const d = el('dot', grid, '', `left:${x - 24 + dx - 9}px;top:${y + dy - 9}px;width:18px;height:18px`); d.dataset.s = c.final.beliefs[k]; return d; });
    const ln = wire(`M${x - 2},${y} H${x + 18}`, wGrid);
    const ring = el('ring', grid, '', `left:${x + 20}px;top:${y - 16}px;width:32px;height:32px`); ring.dataset.s = c.parent.outcome;
    on(t => { const o = vis(t, t0, 1e9, .5); dots.forEach(d => show(d, o)); ln.style.opacity = .7 * o; show(ring, vis(t, t0 + .18, 1e9, .5));
      const age = t - (t0 + .18); ring.style.transform = `scale(${1 + (age > 0 && age < .45 ? Math.sin(Math.PI * age / .45) * .18 : 0)})`; }); });
  const t1 = at(el('tally', grid, `${A[arm].wrong}<small>/${D.worlds.length}</small>`), 1490, y - 24);
  const t2 = at(el('tally', grid, `${D.clean[arm].vote_correct}<small>/${D.worlds.length}</small>`), 1650, y - 24);
  on(t => { show(t1, vis(t, T.D2 + .4 + ai * .25), 10); show(t2, vis(t, T.D4 + .4 + ai * .25), 10); }); });
const th1 = at(el('inst', grid, 'parent wrong'), 1490, 180), th2 = at(el('inst', grid, 'clean vote right'), 1650, 180);
const prim = at(el('inst', grid, `primary measure // wrong parent, board minus private, net of clean // ` +
  D.primary.per_world.map(p => `${p.world}: ${p.contrast}`).join(' // ')), GX(0) - 46, 886);
const verdict = at(el('inst', grid, `six worlds // one model // one run // qualification not passed // a readout, not an effect size`), GX(0) - 46, 886);
const gl = [['false', 'planted value'], ['true', 'true value'], ['none', 'no value / parent abstains']]
  .map(([s, text], i) => at(el('legend', grid, `<div class="dot" data-s="${s}"></div><span>${text}</span>`), 100, 846 + i * 30));
on(t => { heads.forEach((n, i) => show(n, vis(t, tCol(i), 1e9, .5))); groups.forEach((n, i) => show(n, vis(t, tCol(i * 3) + .4)));
  gl.forEach((n, i) => show(n, vis(t, T.D1 + .9 + i * .1)));
  show(th1, vis(t, T.D2 + .2)); show(th2, vis(t, T.D4 + .2));
  show(prim, vis(t, T.D3 + .4, T.D5 - .1)); show(verdict, vis(t, T.D5 + .5));
  const o = 1 - io((t - (T.E - .1)) / .5); grid.style.opacity = o; wGrid.style.opacity = o; });

/* ------------------------------------------------------------------ end card */
const end = document.getElementById('end');
const eBy = el('by inst', end, 'made by'), eName = el('name', end, 'dmarz');
const eHow = el('how', end, `built by an AI agent from the run's own journal: ${D.run.calls} model calls, ${D.run.cases} cases, $${D.run.cost_usd.toFixed(2)}<br>exploratory qualification run; independent review pending`);
const eQr = el('qr', end, QR), eUrl = el('url', end, 'github.com/dmarzzz/swarm-lab');
const mark = document.getElementById('mark'), mark2 = document.getElementById('mark2');
on(t => { [eBy, eName, eHow, eQr, eUrl].forEach((n, i) => show(n, vis(t, T.E + .4 + i * .12), 10));
  mark.style.opacity = vis(t, 1.6, T.E - .2); mark2.style.opacity = vis(t, T.E + .5); });

/* ------------------------------------------------------------------ playback */
function seek(t) { t = clamp(t, 0, DURATION); for (const f of anims) f(t); window.__t = t; }
window.__seek = seek;
window.__meta = { duration: DURATION, fps: 30, end: T.E, times: T, mark: { x: 1700, y: 910, size: 134 }, mark2: { x: 520, y: 372, size: 300 } };
const params = new URLSearchParams(location.search), bar = document.getElementById('bar');
if (params.has('record')) { document.body.classList.add('record'); seek(0); }
else {
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); film.style.transform = `scale(${s})`;
    film.style.left = (innerWidth - 1920 * s) / 2 + 'px'; film.style.top = (innerHeight - 1080 * s) / 2 + 'px'; };
  addEventListener('resize', fit); fit();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !still && !params.has('t'), t0 = performance.now() - 1000 * (parseFloat(params.get('t')) || (still ? T.D5 + 3 : 0));
  const tick = now => { if (playing) { let t = (now - t0) / 1000; if (t >= DURATION) { t = DURATION; playing = false; } seek(t); bar.firstChild.style.width = (100 * t / DURATION) + '%'; } requestAnimationFrame(tick); };
  seek(parseFloat(params.get('t')) || (still ? T.D5 + 3 : 0)); requestAnimationFrame(tick);
  const jump = t => { t0 = performance.now() - 1000 * t; seek(t); bar.firstChild.style.width = (100 * t / DURATION) + '%'; };
  addEventListener('keydown', e => { if (e.code === 'Space') { playing = !playing; t0 = performance.now() - 1000 * window.__t; }
    if (e.code === 'ArrowRight') jump(Math.min(DURATION, window.__t + 2)); if (e.code === 'ArrowLeft') jump(Math.max(0, window.__t - 2)); });
  bar.addEventListener('click', e => jump(DURATION * e.clientX / innerWidth));
}
</script>
</body>
</html>
