# Frozen design of sybil-split-xmodel: a cross-model replication of sybil-split-opus on two pre-registered models.
# Everything from `families` to `analysis` is the parent's design.yaml at the pinned parent commit, unchanged,
# except the model route, the stage backends and the budget. Covered by study.source_hash().
version: 1
experiment: sybil-split-xmodel
status: exploratory
questions:
- SEC-19
- SEC-43
# Two pre-registered models. Each runs as its own complete chain (own batches suffixed by the model tag,
# own ledger, dollar cap, results, P0 and Q0) chosen by STUDY_MODEL (launcher --model); results are
# never pooled across models and every row names its model. The first entry is the default.
model_ladder: [qwen/qwen3.7-flash, gpt-6-sol]
model: qwen/qwen3.7-flash      # the default (first) model; kept for the launcher's READY.yaml check
# Reasoning is disabled on the Qwen route, so effort does not apply there; the key stays because the
# launcher requires it. gpt-6-sol takes reasoning_effort low (below).
effort: low
models:
  qwen/qwen3.7-flash:
    tag: qwen
    backend: openrouter
    canonical_model: qwen/qwen3.7-flash-20260727
    provider: alibaba
    # research program v5 selected-model.json request template, unchanged
    request_template:
      model: qwen/qwen3.7-flash
      provider:
        only: [alibaba]
        allow_fallbacks: false
        require_parameters: true
      reasoning:
        enabled: false
      max_tokens: 1000
      response_format:
        type: json_object
    budget:
      aggregate_usd: 3
      max_output_tokens: 1000
      max_input_tokens: 31000          # price tier below 32,000 prompt tokens
      input_usd_per_million: 0.03
      output_usd_per_million: 0.13
  gpt-6-sol:
    tag: sol
    backend: openai
    canonical_model: gpt-6-sol
    provider: openai
    # OpenAI Chat Completions; reasoning effort low (recorded in every request and row). JSON-object mode,
    # the same prompt and the same local validation as the Qwen route.
    request_template:
      model: gpt-6-sol
      reasoning_effort: low
      max_completion_tokens: 2000
      response_format:
        type: json_object
    budget:
      # Expected: 2,749 calls x about 3,700 to 6,500 input tokens = 10 to 18 M tokens, USD 20 to 45 at the
      # cache-write bound (USD 2.50 per million), plus output; cap set by the fleet monitor at USD 90.
      aggregate_usd: 90
      max_output_tokens: 2000            # max_completion_tokens covers visible plus reasoning tokens
      max_input_tokens: 31000
      prices: {input: 2.0, cached_input: 0.2, cache_write: 2.5, output: 10.0}   # reference openai_provider.PRICES row, retrieved 2026-10-04T12:10Z
      input_usd_per_million: 2.0
      output_usd_per_million: 10.0
