id: sybil-scarcity-opus
title: Does Sybil-resistant accuracy depend on repeated knowledge? (Opus 5.5)
description: 972 simulated identities; the number of honest identities that carry each
  rare fact is cut from 81 to 27, 9, 3 or 1 while the graph, audits, admission and attacker
  reports stay identical. Random versus coverage auditing at 4, 64 or 108 checks, two check
  strengths. claude-opus-5-5 (effort low) synthesizes each 486-report packet. Exploratory.
