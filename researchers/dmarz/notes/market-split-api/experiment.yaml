id: market-split-api
owner: dmarz
title: Market splitting — Sonnet with reasoning
description: 'Completed neutral Sonnet pilot: 36/36 valid episodes across six related
  markets. Splitting and sustained evasion in 6/6 firm-regulated flexible episodes,
  0/6 owner and 0/6 unregulated. Results, records and post-mortem published; next
  diagnostic plan unstarted.'
url: https://github.com/dmarzzz/swarm-lab/blob/18a520695d2ffb93f022854a0f044b32a1b1064b/researchers/dmarz/notes/market-split-api/README.md
