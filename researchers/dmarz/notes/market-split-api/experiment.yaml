id: market-split-api
owner: dmarz
title: Will a neutral agent create firms to evade concentration rules?
description: MKT-03 + MKT-11 exploratory neutral-model discovery pilot. Same owner
  resources, optional registration, firm versus beneficial-owner regulation. Scripted
  qualification and model results are labeled separately.
url: https://github.com/dmarzzz/swarm-lab/tree/main/researchers/dmarz/notes/market-split-api
params:
  stage:
    type: str
    role: stage
    label: Stage
    value_labels:
      S0: Scripted checks
      I0: Action mechanics
      Q0: Profit qualification
      S1: Discovery pilot
  regulator:
    type: str
    role: condition
    label: Regulation
    value_labels:
      none: No regulator
      firm: Firm-based
      owner: Owner-based
  task_id:
    type: int
    role: replicate
    label: Market
  seed:
    type: int
    role: replicate
  backend:
    type: str
    role: fixed
  attempt_id:
    type: str
    role: condition
    label: Version / attempt
    value_labels:
      s1-001: "V2 \u2014 stopped after invalid allocation"
      s1-002: "V4 \u2014 Sonnet 4.6 / capacity limits"
      q0-001: "Q0 v1 \u2014 failed notes"
      q0-002: "Q0 v2 \u2014 passed"
      q0-003: "Q0 Haiku v3 \u2014 profit floor failed"
      q0-004: "Q0 Sonnet v4 \u2014 fresh qualification"
  code:
    role: fixed
  engine_sha256:
    role: fixed
  design_sha256:
    role: fixed
  model:
    role: fixed
  rounds:
    role: fixed
  arms:
    role: fixed
  threshold:
    role: fixed
  registration_fee:
    role: fixed
metrics:
- episodes
- invalid
- fragmentation_dynamic
- fragmentation_locked
- profit_dynamic
- profit_locked
- model_calls
- api_cost_usd
- qualification_pass
- visual_ok
primary_metric: fragmentation_dynamic
