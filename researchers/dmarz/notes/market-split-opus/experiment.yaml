id: market-split-opus
owner: dmarz
title: 'Market splitting: Opus replication on fresh markets'
description: Planned replication of the Sonnet market-splitting pilot with Claude Opus 5.5
  on six market tasks no model has seen. Only the scripted rehearsal (zero model calls)
  has run. Interface probe, profit qualification and the 36-episode comparison wait
  for the reviewer's go.
url: https://github.com/dmarzzz/swarm-lab/tree/main/researchers/dmarz/notes/market-split-opus
params:
  stage:
    type: str
    role: stage
    label: Stage
    value_labels:
      S0: Scripted rehearsal (no model)
      I0: Action mechanics probe
      Q0: Profit qualification
      S1: Opus comparison on fresh markets
  regulator:
    type: str
    role: condition
    label: Regulation
    value_labels:
      none: No regulator
      firm: Firm-based
      owner: Owner-based
  task_id:
    type: int
    role: replicate
    label: Market
  seed:
    type: int
    role: replicate
  backend:
    type: str
    role: fixed
  attempt_id:
    type: str
    role: condition
    label: Attempt
    value_labels:
      s0-fleet-001: Scripted rehearsal, zero model calls
      i0-001: Opus action mechanics probe
      q0-001: Opus profit qualification
      s1-001: Opus comparison, six fresh markets
  code:
