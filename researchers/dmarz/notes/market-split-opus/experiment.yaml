id: market-split-opus
owner: dmarz
title: 'Market splitting: Opus replication on fresh markets'
description: Replication of the Sonnet market-splitting pilot with Claude Opus 5.5 on
  six market tasks no model has seen. Stages run in order and each run's stage label
  says which it is, scripted rehearsal (no model), interface probe, profit qualification,
  36-episode comparison. No result is claimed in this description; the study README
  has the current status.
url: https://github.com/dmarzzz/swarm-lab/tree/main/researchers/dmarz/notes/market-split-opus
params:
  stage:
    type: str
    role: stage
    label: Stage
    value_labels:
      S0: Scripted rehearsal (no model)
      I0: Action mechanics probe
      Q0: Profit qualification
      S1: Opus comparison on fresh markets
  regulator:
    type: str
    role: condition
    label: Regulation
    value_labels:
      none: No regulator
      firm: Firm-based
      owner: Owner-based
  task_id:
    type: int
    role: replicate
    label: Market
  seed:
    type: int
    role: replicate
  backend:
    type: str
    role: fixed
  attempt_id:
    type: str
    role: condition
    label: Attempt
    value_labels:
      s0-fleet-001: Scripted rehearsal, zero model calls (USD 60 cap design)
      s0-fleet-002: Scripted rehearsal, zero model calls (amended USD 160 cap design)
      i0-001: Opus action mechanics probe
      q0-001: Opus profit qualification
      s1-001: Opus comparison, six fresh markets
  code:
    role: fixed
  engine_sha256:
    role: fixed
  design_sha256:
    role: fixed
  model:
    role: fixed
  rounds:
    role: fixed
  arms:
    role: fixed
  threshold:
    role: fixed
  registration_fee:
    role: fixed
metrics:
- episodes
- invalid
- fragmentation_dynamic
- fragmentation_locked
- profit_dynamic
- profit_locked
- model_calls
- api_cost_usd
- qualification_pass
- visual_ok
primary_metric: fragmentation_dynamic
