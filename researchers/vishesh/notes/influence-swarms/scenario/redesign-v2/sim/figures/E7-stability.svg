<text x="1124.00" y="606.00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7e9099" text-anchor="start" font-weight="normal" xml:space="preserve"></text>
<text x="1124.00" y="624.00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7e9099" text-anchor="start" font-weight="normal" xml:space="preserve">It does NOT fix the H axis. The acceptable set</text>
<text x="1124.00" y="642.00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7e9099" text-anchor="start" font-weight="normal" xml:space="preserve">is reordered by the human-cost assumption, so</text>
