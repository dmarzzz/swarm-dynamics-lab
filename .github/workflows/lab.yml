name: lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate repo and prior-art gate
        run: python3 scripts/lab.py check
      - name: Check experiment confidence and sample-size metadata
        run: |
          python3 scripts/experiment_evidence.py --check
          python3 -m unittest discover -s scripts -p 'test_experiment_evidence.py'
      - name: Check experiment operations without model calls
        run: |
          python3 scripts/experiment.py list
          python3 -m unittest discover -s scripts -p 'test_experiment_operations.py'
          python3 -m unittest discover -s scripts -p 'test_experiment_theseus.py'

  verify:
    # Every paper added or changed in this push must resolve on Crossref/DataCite with a matching title.
    # Catches invented or misattributed citations from any agent. Network failures are skipped, not failed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify new and changed papers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          python3 scripts/lab.py verify --since "$BASE"

  index:
    # Rebuild the generated dashboard even when the check fails, so STATUS.md stays current.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # serialise only the index rebuild; checks run for every push
    concurrency:
      group: lab-index
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rebuild STATUS.md and library/INDEX.md and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "swarm-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/lab.py index
            git add STATUS.md library/INDEX.md
            if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
            git commit -m "[bot] index: rebuild STATUS.md and library/INDEX.md [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep $((i * 3))
          done
          exit 1
