name: lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate repo and prior-art gate
        run: python3 scripts/lab.py check

  index:
    # Rebuild the generated dashboard even when the check fails, so STATUS.md stays current.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # serialise only the index rebuild; checks run for every push
    concurrency:
      group: lab-index
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rebuild STATUS.md and library/INDEX.md and push
        run: |
          git config user.name "swarm-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            python3 scripts/lab.py index
            git add STATUS.md library/INDEX.md
            if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
            git commit -m "[bot] index: rebuild STATUS.md and library/INDEX.md [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            sleep $((i * 3))
          done
          exit 1
