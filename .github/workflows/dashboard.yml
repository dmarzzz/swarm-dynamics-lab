name: Dashboard
on:
  push:
    branches: [main, dashboard-v1]
    paths:
      - 'library/**'
      - 'tasks/**'
      - 'surveys/**'
      - 'researchers/**'
      - 'candidates/**'
      - 'hypotheses/**'
      - 'experiments/**'
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: dashboard
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Export repository data
        run: python dashboard/scripts/export.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate data contract
        run: python dashboard/scripts/test_export.py
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build
      - name: Deploy Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler@3 pages deploy dashboard/dist --project-name swarm-lab --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
