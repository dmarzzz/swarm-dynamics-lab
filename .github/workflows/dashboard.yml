name: Dashboard (swarm-research.pages.dev)
on:
  push:
    branches: [main, dashboard-v1]
    paths:
      - '1-library/**'
      - '2-surveys/**'
      - '4-hypotheses/**'
      - '5-experiments/**'
      - 'lab/tasks/**'
      - 'lab/researchers/**'
      - 'lab/candidates/**'
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: dashboard
  # Frequent agent pushes must not interrupt an active build/deploy.
  # GitHub keeps one pending run, replacing it as newer updates arrive.
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Export repository data
        run: python dashboard/scripts/export.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate data contract
        run: python dashboard/scripts/test_export.py
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && node scripts/test_research_navigation.mjs && node scripts/test_question_reviews.mjs && npx tsc --noEmit && npm run build
      - name: Deploy Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler@3 pages deploy dashboard/dist --project-name swarm-research --branch ${{ github.ref_name }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_SWARM_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_SWARM_ACCOUNT_ID }}
