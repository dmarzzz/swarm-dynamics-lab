name: agent-experiment-toolkit

on:
  push:
    branches: [main]
    paths:
      - 'tooling/agent-experiments/**'
      - '.github/workflows/agent-experiment-toolkit.yml'
  pull_request:
    paths:
      - 'tooling/agent-experiments/**'
      - '.github/workflows/agent-experiment-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate templates, pairing, replay and integrity without provider calls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tooling/agent-experiments/scripts/validate.py
