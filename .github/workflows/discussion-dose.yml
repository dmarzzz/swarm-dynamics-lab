name: discussion-dose
on:
  push:
    branches: [main]
    paths:
      - '5-experiments/studies/dmarz/discussion-dose/**'
      - '.github/workflows/discussion-dose.yml'
  pull_request:
    paths:
      - '5-experiments/studies/dmarz/discussion-dose/**'
      - '.github/workflows/discussion-dose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check task truth, access isolation, lifecycle scoring and mock adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 5-experiments/studies/dmarz/discussion-dose/src/selftest.py
